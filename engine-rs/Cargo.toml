# The compiled accelerator for royals_engine. The Python package stays the reference
# implementation and the fallback -- see docs/PORTING.md -- so this crate is optional at
# every level: an optional dependency of the wheel, an optional wheel for the app.
#
# Every feature and optional dependency is declared here rather than added as each one was
# needed, which is why this file has barely changed since the port started: the shape of the
# crate was settled before the modules existed, so nothing about adding a rule touches it.

[package]
name = "royals-engine"
version = "0.1.0"
edition = "2021"
# PyPy compatibility is load-bearing on the Python side; here the equivalent constraint is
# just "an old-stable Rust builds it". LazyLock (1.80) is the newest thing used.
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
# maturin renames the cdylib to whatever pyproject.toml's module-name says -- `royals_accel`,
# top-level and deliberately not `royals_engine._rust`; see _accel.py for why -- so this is
# the Rust-side crate name and nothing more.
name = "royals_engine"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The PyO3 bindings, built by maturin into the royals_accel wheel.
python = ["dep:pyo3"]
# The browser build. Single-threaded, no SharedArrayBuffer.
#
# It carries **no dependency**, where wasm-bindgen would be the obvious one. Two reasons, both
# found on turning it on: the wasm-bindgen CLI that must match the crate needs rustc 1.86 against
# this crate's 1.80, so rebuilding the module would need a second pinned tool on top of the
# target -- and the interface turned out to be two byte buffers and five integers, which is
# nothing to generate glue for. `src/wasm.rs` exports plain C functions and `static/engine.js`
# is the fifty hand-written lines that call them. Don't reinstate the dependency without
# reading that file first.
wasm = []

[dependencies]
# Pinned to what the toolchain in this repo builds rather than to the newest release. Bumping
# one is a deliberate act: `rust-version` above is what the CI wheel job and anybody's `cargo
# build` have to satisfy.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }

# No dev-dependencies, and none are wanted. The table-conformance tests parse the Python
# fixtures with the standard library alone, so `cargo test` works offline and stays fast.

[profile.release]
# The whole point of the exercise. panic = "abort" is deliberately NOT set: PyO3 converts a
# panic into a Python exception, which needs unwinding.
lto = true
codegen-units = 1
