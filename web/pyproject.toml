[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "royals-web"
version = "0.1.0"
description = "Play Royals in a browser."
requires-python = ">=3.11"

# Short and boring on purpose. Every dependency here is code that runs in the same
# process as the move validator, so the list is kept to things that earn their place.
# royals-engine itself stays dependency-free -- see engine/pyproject.toml.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "royals-engine",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
