name: CI

on:
  push:
  pull_request:

# The point of this workflow is one thing above all others: golden_moves.txt must not move.
#
# tests/golden_moves.txt is a 13,051-line record of what every legal move does to the board
# and what every resulting position is worth. It is the rules contract. Any change to the
# engine that leaves it byte-identical is provably behaviour-preserving; any change that
# moves it needs a human to say why. That check is worth more than every other test here.
#
# It runs under CPython and PyPy both, on purpose. The search scores in integers rather
# than floats specifically because the two interpreters once disagreed in the last place
# on a square root, which flipped an alpha-beta cutoff and changed the move played -- the
# suite passed under one interpreter and failed under the other. Running only one of them
# would let that class of bug back in.
#
# The goldens are checked as three separate baselines because they are allowed to move for
# three different reasons -- see the header of tests/regress.py. In particular
# golden_enter.txt is bound to CPython's Mersenne Twister and golden_moves.txt is not,
# which is what lets a second implementation of the rules be checked against the latter
# without having to reimplement the former.

jobs:
  goldens:
    name: goldens (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPy is not decoration: it is faster on this search and is the intended
        # interpreter for the server's AI worker, which is why the engine is pinned to
        # requires-python >=3.10 and kept dependency-free.
        python: ["3.12", "pypy3.10"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./engine
          python -m pip install pytest

      # Split out so a failure names which contract broke. Entering can only move if the
      # entering heuristic or the Perlin field changed; moves can only move if the rules
      # changed. Reporting them together made a rules bug and an opening-book tweak look
      # like the same event.
      - name: Rules contract -- golden_moves.txt must be byte-identical
        working-directory: tests
        run: python regress.py check moves

      - name: Entering contract -- golden_enter.txt must be byte-identical
        working-directory: tests
        run: python regress.py check enter

      - name: Search internals -- golden_search.txt
        working-directory: tests
        run: python regress.py check search

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Engine imports cleanly with no UI present
        run: |
          python -c "
          from royals_engine import hasher as Hasher
          from royals_engine import engine as Engine
          from royals_engine import ai as AI
          b = Hasher.Entering_Board()
          assert len(b) == 49 and all(0 <= v < 8192 for v in b)
          print('engine OK on', __import__('sys').implementation.name)
          "

  # The differential check: the same suite, run twice, once with whatever compiled
  # accelerator is installed and once with ROYALS_NO_ACCEL=1 forcing the pure-Python
  # fallback. Both runs must produce identical goldens.
  #
  # This is what makes keeping two implementations of the engine worth the cost. A port
  # validated once and then left alone rots; a port re-validated against a 13,051-line
  # oracle on every commit cannot drift without saying so.
  #
  # The compiled engine is built here rather than assumed, so this job fails if the Rust and
  # the Python ever stop agreeing -- which is the entire reason two implementations are worth
  # keeping. golden_search.txt is included on purpose: it records node counts, so matching it
  # means the two searches walked the same tree, not merely that they picked the same move.
  differential:
    name: compiled and Python agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the engine and build the accelerator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./engine
          python -m pip install pytest maturin
          maturin build --release --manifest-path engine-rs/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist royals-accel

      # A wheel that installs but does not import would otherwise show up as "the fallback
      # matches itself", which is green and meaningless. Assert the accelerator is really
      # the thing answering before comparing anything.
      - name: The accelerator is actually in use
        run: |
          python -c "
          from royals_engine import _accel
          assert _accel.active(), _accel.describe()
          print(_accel.describe())
          "

      - name: Goldens, compiled
        working-directory: tests
        run: python regress.py check all

      - name: Goldens, pure-Python fallback
        working-directory: tests
        env:
          ROYALS_NO_ACCEL: "1"
        run: python regress.py check all

      - name: Unit tests, compiled
        run: python -m pytest tests/ -q

      - name: Unit tests, pure-Python fallback
        env:
          ROYALS_NO_ACCEL: "1"
        run: python -m pytest tests/ -q

  # The browser gets its own copy of the engine -- web/src/royals_web/static/royals.wasm, which
  # is what makes picking a piece up instant instead of a request. It is a build artifact that
  # is CHECKED IN, and that makes it the one piece of this engine that can go stale without
  # saying so: edit movegen.rs, forget to rebuild, and the page keeps highlighting yesterday's
  # rules while every other job here stays green. Nothing else has that failure mode -- the
  # Python engine is the source, and the accelerator is rebuilt from source above.
  #
  # So the shipped module is asked what the Python engine is asked -- every position along the
  # port fixtures' walks, every square, both sides, carrying prisoners and not -- and has to
  # answer the same. A freshly built module is checked the same way,
  # which is what separates "the Rust and Python rules have diverged" from "somebody forgot to
  # rebuild the artifact". Those want different fixes and the script says which it found.
  #
  # Behaviour rather than bytes, deliberately. Diffing the artifact against a fresh build would
  # be simpler and would fail the day the runner's rustc moves, for a module that plays exactly
  # the same game -- a check nobody can act on, which is a check that gets switched off.
  browser:
    name: browser engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the engine and a wasm runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./engine
          python -m pip install wasmtime

      # No wasm-bindgen, no npm, no generated glue: the module exports plain C functions and
      # static/engine.js is the fifty hand-written lines that call them. See engine-rs/src/wasm.rs
      # for why -- briefly, the matching wasm-bindgen CLI needs a newer rustc than this crate
      # builds on, and the whole interface is two byte buffers.
      - name: Build the browser engine
        run: cargo build --release --features wasm --target wasm32-unknown-unknown
        working-directory: engine-rs

      - name: The shipped module plays by the same rules
        run: |
          python engine-rs/tests/wasm_parity.py \
            engine-rs/target/wasm32-unknown-unknown/release/royals_engine.wasm

  # Wheels for the platforms the game is actually played on. abi3-py310 means one wheel per
  # platform covers every CPython from 3.10 up, so this matrix is four builds rather than
  # four times however many minor versions are current.
  #
  # Not a release job: it proves the wheel builds everywhere on every commit. Publishing is a
  # separate, deliberate act -- an accelerator that silently ships itself is one nobody
  # decided to ship.
  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64 }
          - { os: macos-14,       target: macos-arm64 }
          - { os: macos-13,       target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --manifest-path engine-rs/Cargo.toml --out dist

      # Building is not the same as loading. A wheel with the wrong architecture or a missing
      # symbol installs perfectly happily and fails at import, which is exactly the failure
      # install-desktop.sh is written to survive -- but it should never get the chance.
      - name: Install it and check it answers
        run: |
          python -m pip install --no-index --find-links dist royals-accel
          python -m pip install -e ./engine
          python -c "
          import royals_accel
          from royals_engine import hasher as Hasher, ai as AI, _accel
          assert _accel.active(), _accel.describe()
          board = Hasher.Entering_Board()
          assert AI.evaluateSides(board) == [0, 0]
          print(_accel.describe())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  # The job above installs only the engine, so tests/test_web_api.py hits its
  # `pytest.importorskip("fastapi")` and skips in silence -- a green run that checked
  # none of the server. Everything about who may move in a game lives in those tests, so
  # they get a job that installs the web package and refuses to skip.
  #
  # CPython only, deliberately. The goldens matrix runs PyPy because the rules contract
  # is the thing that must agree across interpreters; FastAPI under PyPy is slow to
  # install, occasionally broken, and proves nothing about the engine.
  web:
    name: web API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engine and the web package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./engine -e ./web
          python -m pip install pytest httpx

      # importorskip turns a missing FastAPI into a silent pass, so the condition that
      # would hollow out this job is checked directly and fails it instead.
      - name: FastAPI is really installed
        run: python -c "import fastapi, httpx; print('fastapi', fastapi.__version__)"

      - name: Server tests
        run: python -m pytest tests/test_web_api.py -q

      # The engine has no dependencies at all, which is the whole point of that rule and
      # leaves nothing here to audit. The server has three, and they run in the same
      # process as the move validator -- so a known hole in any of them is a known hole in
      # Royals. Advisory rather than blocking: a fresh CVE in a transitive dependency
      # should tell you about itself, not stop you fixing something unrelated.
      - name: Dependency advisories
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
